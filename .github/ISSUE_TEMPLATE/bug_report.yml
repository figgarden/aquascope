name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please paste the output of `aquascope --doctor`.
        It shows your OS, Python, terminal, and audio devices, and hides your home folder as `~`.
        Remove any device names you'd rather keep private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`aquascope --doctor` output"
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal app
      placeholder: e.g. Windows Terminal, iTerm2, kitty, GNOME Terminal
